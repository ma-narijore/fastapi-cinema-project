[project]
name = "fastapi-cinema-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Oleh",email = "narijore@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.139.0)",
    "uvicorn (==0.51.0)",
    "sqlalchemy (==2.0.51)",
    "psycopg2-binary (==2.9.12)",
    "alembic (==1.18.5)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.14.2)",
    "email-validator (==2.3.0)",
    "python-dotenv (==1.2.2)",
    "celery (==5.6.3)",
    "redis (==8.0.1)",
    "python-jose (==3.5.0)",
    "passlib (==1.7.4)",
    "bcrypt (==4.2.1)",
    "python-multipart (==0.0.32)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=9.1.1,<10.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "==9.1.1"
ruff = "==0.15.21"
mypy = "==1.14.1"
pytest-cov = "==6.0.0"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app", "scripts"]

[tool.ruff.lint.per-file-ignores]
# conftest sets required env vars before importing `app.*`, so imports must
# intentionally come after module-level code.
"tests/conftest.py" = ["E402"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
