services:
  web:
    build: .
    container_name: fastapi_web

    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.create_admin &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      SECRET_KEY: super_secret_key_123456789
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  celery_worker:
    build: .
    container_name: fastapi_celery_worker

    command: celery -A app.celery_app:celery_app worker --loglevel=info

    volumes:
      - .:/app

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      SECRET_KEY: super_secret_key_123456789

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  celery_beat:
    build: .
    container_name: fastapi_celery_beat

    command: celery -A app.celery_app:celery_app beat --loglevel=info

    volumes:
      - .:/app

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      SECRET_KEY: super_secret_key_123456789

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: fastapi_postgres

    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastapi_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: fastapi_mailpit

    ports:
      - "1025:1025"
      - "8025:8025"

    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: fastapi_minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:
  minio_data: